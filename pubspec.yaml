name: kim
description: Offline personal finance workspace — Flutter Web foundation.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  sembast: ^3.8.0
  sembast_web: ^2.4.0
  uuid: ^4.5.0
  web: ^1.1.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  pdf: ^3.13.1
  archive: ^4.5.2
  cryptography: ^2.9.0
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic.ttf
    - assets/fonts/NotoSans.ttf
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
