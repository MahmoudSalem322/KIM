<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kim — your private, offline personal finance workspace.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F7F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1C22" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="wallet.svg">
  <link rel="manifest" href="manifest.json">
  <title>Kim</title>
  <style>
    :root{--kim-bg:#f4f7f6;--kim-fg:#087f68;--kim-track:rgba(8,127,104,.18)}
    @media (prefers-color-scheme:dark){:root{--kim-bg:#0c1c22;--kim-fg:#70dfc0;--kim-track:rgba(112,223,192,.2)}}
    html,body{margin:0;background:var(--kim-bg)}
    #loading{height:100vh;display:grid;place-content:center;justify-items:center;gap:18px;font:600 20px system-ui,sans-serif;color:var(--kim-fg)}
    #loading i{width:28px;height:28px;border-radius:50%;border:3px solid var(--kim-track);border-top-color:var(--kim-fg);animation:kim-spin .9s linear infinite}
    @keyframes kim-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#loading i{animation:none}}
    noscript{display:block;padding:24px;text-align:center;font:16px system-ui,sans-serif;color:var(--kim-fg)}
  </style>
</head>
<body>
  <div id="loading" role="progressbar" aria-busy="true" aria-label="Kim"><i></i><span>Kim</span></div>
  <noscript>يتطلب Kim تفعيل JavaScript. · Kim requires JavaScript.</noscript>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
